<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>우리, 다시 만날 수 있을까</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700&family=Gowun+Dodum&family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root{
    --outer-1:#241a14;
    --outer-2:#2f221a;
    --paper:#F8EFE2;
    --paper-soft:#EFE1CB;
    --paper-line:#E4D3B4;
    --ink:#3B2A1E;
    --ink-soft:#8A7358;
    --ink-faint:#8A6F52;
    --gold:#B98A52;
    --gold-deep:#96683A;
    --gold-soft:#E3C79A;
    --rose:#A9705C;
    --rose-soft:#D8B6A9;
    --skin:#E8C39C;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0; height:100%;}
  body{
    min-height:100dvh;
    font-family:'Gowun Dodum', sans-serif;
    color:var(--ink);
  }
  .phone{
    width:100%;
    min-height:100dvh;
    background:
      radial-gradient(120% 90% at 50% 0%, #CDAB80 0%, #C5A17A 55%, #B99271 100%);
    overflow:hidden;
    position:relative;
    display:flex;
    flex-direction:column;
  }
  .phone::before{
    content:'';
    position:absolute; inset:0;
    background-image: radial-gradient(rgba(185,138,82,0.35) 0.6px, transparent 0.6px);
    background-size:26px 26px;
    opacity:0.25;
    pointer-events:none;
  }
  .screen{
    display:none;
    flex-direction:column;
    padding:40px 26px 28px;
    flex:1;
    opacity:0;
    transform:translateY(14px);
    transition:opacity .45s ease, transform .45s ease;
    position:relative;
    z-index:1;
  }
  .screen.active{display:flex;}
  .screen.show{opacity:1; transform:translateY(0);}

  .eyebrow{
    font-size:12px;
    letter-spacing:0.18em;
    color:var(--gold-deep);
    text-align:center;
    margin-bottom:6px;
  }
  h1.title-deco{
    font-family:'Nanum Myeongjo', serif;
    font-size:27px;
    font-weight:800;
    letter-spacing:0.01em;
    position:relative;
    padding:0 0 14px;
  }
  .title-flourish{
    display:flex; align-items:center; justify-content:center; gap:8px;
    margin:2px 0 20px;
  }
  .title-flourish svg{opacity:0.9;}
    font-family:'Noto Serif KR', serif;
    font-weight:700;
    font-size:23px;
    text-align:center;
    line-height:1.4;
    margin:0 0 6px;
    color:var(--ink);
  }
  .sub{
    text-align:center;
    font-size:13.5px;
    color:var(--ink-soft);
    margin-bottom:22px;
    line-height:1.55;
  }
  .ornament{display:flex; justify-content:center; margin-bottom:14px;}

  .form-block{margin-bottom:6px;}
  .form-title{
    font-size:13px;
    color:var(--gold-deep);
    font-weight:700;
    letter-spacing:0.03em;
    margin:18px 0 10px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .form-title::after{
    content:'';
    flex:1;
    height:1px;
    background:linear-gradient(to right, var(--paper-line), transparent);
  }
  .field{margin-bottom:14px;}
  .field label{
    display:block;
    font-size:11.5px;
    color:var(--ink-faint);
    letter-spacing:0.04em;
    margin-bottom:5px;
  }
  .field input{
    width:100%;
    border:none;
    border-bottom:1.4px solid var(--paper-line);
    background:transparent;
    padding:8px 2px;
    font-family:'Noto Serif KR', serif;
    font-size:15px;
    color:var(--ink);
    outline:none;
    color-scheme:light;
    transition:border-color .25s ease;
  }
  .field input::placeholder{color:var(--ink-faint); font-family:'Gowun Dodum',sans-serif; font-size:13px;}
  .field input:focus{border-bottom-color:var(--gold);}
  .row2{display:flex; gap:12px;}
  .row2 .field{flex:1;}
  .hint{font-size:11px; color:var(--ink-faint); margin-top:-8px; margin-bottom:14px;}

  .cta{
    margin-top:20px;
    width:100%;
    border:none;
    border-radius:999px;
    padding:15px 0;
    font-family:'Noto Serif KR', serif;
    font-size:15.5px;
    font-weight:600;
    letter-spacing:0.02em;
    color:#fff;
    background:linear-gradient(135deg, var(--gold), var(--gold-deep));
    cursor:pointer;
    box-shadow:0 10px 22px rgba(150,104,58,0.35);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .cta:active{transform:scale(0.98); box-shadow:0 6px 14px rgba(150,104,58,0.3);}
  .cta.ghost{
    background:transparent;
    color:var(--gold-deep);
    box-shadow:none;
    border:1.4px solid var(--gold-soft);
  }
  .link-btn{
    margin-top:14px;
    text-align:center;
    font-size:12.5px;
    color:var(--ink-soft);
    text-decoration:underline;
    cursor:pointer;
    background:none; border:none;
  }
  .error-msg{
    font-size:12px; color:#A54B3C; text-align:center; margin-top:10px; min-height:16px;
  }

  /* Loading */
  #screen-loading{align-items:center; justify-content:center; text-align:center;}
  .knot-spin{animation:spin 3.2s linear infinite;}
  @keyframes spin{ to{ transform:rotate(360deg);} }
  .loading-phrase{
    margin-top:22px;
    font-family:'Noto Serif KR', serif;
    font-size:15px;
    color:var(--ink-soft);
    min-height:24px;
    transition:opacity .4s ease;
  }
  .dots{display:flex; gap:6px; margin-top:16px;}
  .dots span{
    width:5px; height:5px; border-radius:50%; background:var(--gold-soft);
    animation:dotpulse 1.2s infinite ease-in-out;
  }
  .dots span:nth-child(2){animation-delay:.15s;}
  .dots span:nth-child(3){animation-delay:.3s;}
  @keyframes dotpulse{ 0%,80%,100%{opacity:.25; transform:scale(0.8);} 40%{opacity:1; transform:scale(1);} }

  /* Result */
  .names-line{
    text-align:center; font-size:12.5px; color:var(--ink-faint); margin-bottom:2px;
  }
  .gauge-wrap{display:flex; justify-content:center; margin:14px 0 8px;}
  .gauge-num{
    font-family:'Noto Serif KR', serif; font-size:30px; font-weight:700; fill:var(--ink);
  }
  .gauge-label{font-size:10.5px; fill:var(--ink-faint);}
  .section-label{
    font-size:11.5px; color:var(--gold-deep); font-weight:700; letter-spacing:0.05em;
    margin:18px 0 6px;
  }
  .section-text{font-size:14px; line-height:1.75; color:var(--ink); margin:0;}
  .quote-box{
    margin:20px 0;
    padding:16px 18px;
    background:var(--paper-soft);
    border-left:3px solid var(--gold);
    border-radius:4px;
    font-family:'Noto Serif KR', serif;
    font-style:italic;
    font-size:14.5px;
    color:var(--gold-deep);
    line-height:1.6;
  }
  .disclaimer{
    text-align:center; font-size:10.5px; color:var(--ink-soft); margin-top:6px;
  }

  /* Share card */
  #screen-card{align-items:center;}
  .card-canvas{
    width:100%;
    background: radial-gradient(120% 90% at 50% 0%, #CDAB80 0%, #C5A17A 55%, #B99271 100%);
    border:1.4px solid var(--gold-soft);
    border-radius:18px;
    padding:26px 22px;
    position:relative;
  }
  .card-canvas::before{
    content:'';
    position:absolute; inset:8px;
    border:1px solid var(--gold-soft);
    border-radius:12px;
    pointer-events:none;
  }
  .card-inner{position:relative; text-align:center;}
  .card-eyebrow{font-size:10.5px; letter-spacing:0.2em; color:var(--gold-deep); margin-bottom:10px;}
  .card-names{
    font-family:'Noto Serif KR', serif; font-size:16px; color:var(--ink); margin-bottom:16px; font-weight:600;
  }
  .card-score{font-family:'Noto Serif KR', serif; font-size:44px; font-weight:700; color:var(--gold-deep); line-height:1;}
  .card-score-label{font-size:10.5px; color:var(--ink-faint); margin-top:2px; letter-spacing:0.08em;}
  .card-quote{
    font-family:'Noto Serif KR', serif; font-style:italic; font-size:15px; color:var(--ink);
    line-height:1.7; margin:20px 0; padding:0 6px;
  }
  .card-foot{font-size:10px; color:var(--ink-faint); letter-spacing:0.06em; margin-top:8px;}
  .card-actions{display:flex; gap:10px; width:100%; margin-top:22px;}
  .card-actions .cta{margin-top:0;}

  /* Gender pills */
  .gender-group{display:flex; gap:8px; margin-top:2px;}
  .gender-group input[type=radio]{display:none;}
  .gender-pill{
    flex:1; text-align:center; padding:7px 0;
    border:1.2px solid var(--gold-soft); border-radius:999px;
    background:rgba(255,255,255,0.45);
    font-size:12.5px; color:var(--ink-soft); cursor:pointer;
    transition:all .2s ease; user-select:none;
  }
  .gender-group input[type=radio]:checked + .gender-pill{
    background:var(--gold-soft); border-color:var(--gold); color:var(--ink); font-weight:700;
  }

  /* Cupid illustration */
  .cupid-icon{display:block; object-fit:cover; border-radius:14px;}
  .cupid-hero{width:190px; height:190px; margin:0 auto;}
  .cupid-card{width:120px; height:120px; margin:0 auto 6px;}
  .cupid-loading{width:170px; height:170px; margin:0 auto; animation:cupidFloat 2.6s ease-in-out infinite;}
  @keyframes cupidFloat{
    0%,100%{ transform:translateY(0) rotate(-2deg); }
    50%{ transform:translateY(-10px) rotate(2deg); }
  }
</style>
</head>

      <svg width="70" height="10" viewBox="0 0 70 10"><path d="M0,5 H26 M44,5 H70" stroke="var(--gold)" stroke-width="1"/><circle cx="35" cy="5" r="2.4" fill="none" stroke="var(--gold)" stroke-width="1"/><path d="M32,5 q3,-4 3,-4 q3,4 -3,4 M38,5 q-3,-4 -3,-4 q-3,4 3,4" fill="var(--gold-soft)" opacity="0.8"/></svg>
    </div>
    <div class="sub">그 사람에 대해 아는 만큼만 적어주세요</div>

    <div class="form-title">나의 정보</div>
    <div class="field">
      <label>이름</label>
      <input type="text" id="myName" placeholder="이름을 적어주세요">
    </div>
    <div class="field">
      <label>성별</label>
      <div class="gender-group">
        <input type="radio" name="myGender" id="myGenderF" value="여성">
        <label for="myGenderF" class="gender-pill">여성</label>
        <input type="radio" name="myGender" id="myGenderM" value="남성">
        <label for="myGenderM" class="gender-pill">남성</label>
      </div>
    </div>
    <div class="row2">
      <div class="field">
        <label>생년월일</label>
        <input type="text" id="myDate" placeholder="yyyy/mm/dd" inputmode="numeric" maxlength="10">
      </div>
      <div class="field">
        <label>태어난 시간</label>
        <input type="time" id="myTime">
      </div>
    </div>

    <div class="form-title">그 사람의 정보</div>
    <div class="field">
      <label>이름</label>
      <input type="text" id="otherName" placeholder="그 사람의 이름">
    </div>
    <div class="field">
      <label>성별</label>
      <div class="gender-group">
        <input type="radio" name="otherGender" id="otherGenderF" value="여성">
        <label for="otherGenderF" class="gender-pill">여성</label>
        <input type="radio" name="otherGender" id="otherGenderM" value="남성">
        <label for="otherGenderM" class="gender-pill">남성</label>
      </div>
    </div>
    <div class="row2">
      <div class="field">
        <label>생년월일</label>
        <input type="text" id="otherDate" placeholder="yyyy/mm/dd" inputmode="numeric" maxlength="10">
      </div>
      <div class="field">
        <label>태어난 시간</label>
        <input type="time" id="otherTime">
      </div>
    </div>
    <div class="hint">모르면 비워두어도 괜찮아요</div>

      <button class="cta" onclick="downloadCard()">이미지로 저장</button>
    </div>
  </div>

</div>

<script type="module">
import { File, TossAds } from '@apps-in-toss/web-framework';
let currentScreen = 'screen-input';
let loadingInterval = null;

function maskDateInput(el){
  el.addEventListener('input', ()=>{
    let v = el.value.replace(/\D/g,'').slice(0,8);
    let out = v;
    if(v.length > 4) out = v.slice(0,4) + '/' + v.slice(4);
    if(v.length > 6) out = v.slice(0,4) + '/' + v.slice(4,6) + '/' + v.slice(6,8);
    el.value = out;
  });
}
maskDateInput(document.getElementById('myDate'));
maskDateInput(document.getElementById('otherDate'));

// 앱인토스 콘솔에서 발급받은 실제 지면 ID예요.
const AD_GROUP_ID_RESULT_BANNER = "ait.v2.live.1307fed72ae0421d";
let bannerAttached = false;

if (TossAds.initialize.isSupported()) {
  TossAds.initialize({
    callbacks: {
      onInitializationFailed: (e) => console.error('광고 SDK 초기화 실패:', e),
    },
  });
}

function attachResultBanner(){
  if (bannerAttached) return;
  if (!TossAds.attachBanner.isSupported()) return;
  try {
    TossAds.attachBanner(AD_GROUP_ID_RESULT_BANNER, '#ad-banner-result', {
      theme: 'auto',
      variant: 'card',
      callbacks: {
        onNoFill: () => console.log('배너 광고 없음(no fill)'),
        onAdFailedToRender: (e) => console.error('배너 광고 렌더 실패:', e),
      },
    });
    bannerAttached = true;
  } catch (e) {
    console.error('배너 광고 부착 실패:', e);
  }
}

// 렌더 무료 티어는 비활성 상태면 잠들어요. 입력화면이 뜨자마자 미리 깨워둬서
// 사용자가 폼을 채우는 동안(보통 수십 초) 서버가 준비되도록 해요.
fetch(`${API_BASE}/`).catch(() => {});

window.addEventListener('DOMContentLoaded', ()=>{
  requestAnimationFrame(()=> requestAnimationFrame(()=>{
    document.getElementById(currentScreen).classList.add('show');
  }));
});

function showScreen(id){
  document.getElementById(currentScreen).classList.remove('active','show');
  const next = document.getElementById(id);
  next.classList.add('active');
  requestAnimationFrame(()=> requestAnimationFrame(()=> next.classList.add('show')));
  currentScreen = id;
}

function resetApp(){
  showScreen('screen-input');
}

const phrases = [
  "두 사람의 사주를 살펴보는 중...",
  "인연의 실을 찾는 중...",
  "오행의 기운을 헤아리는 중...",
  "따뜻한 말을 고르는 중..."
];

async function startReading(){
  const myName = document.getElementById('myName').value.trim();
  const myGender = document.querySelector('input[name="myGender"]:checked')?.value || '';
  const myDate = document.getElementById('myDate').value;
  const myTime = document.getElementById('myTime').value;
  const otherName = document.getElementById('otherName').value.trim();
  const otherGender = document.querySelector('input[name="otherGender"]:checked')?.value || '';
  const otherDate = document.getElementById('otherDate').value;
  const otherTime = document.getElementById('otherTime').value;

  const errEl = document.getElementById('formError');
  if(!myName || !myDate || !otherName){
    errEl.textContent = '나의 이름·생년월일과 그 사람의 이름은 꼭 입력해주세요';
    return;
  }
  errEl.textContent = '';

  window.__reading = {myName, myGender, myDate, myTime, otherName, otherGender, otherDate, otherTime};

  showScreen('screen-loading');
  let i = 0;
  const phraseEl = document.getElementById('loadingPhrase');
  loadingInterval = setInterval(()=>{
    i = (i+1) % phrases.length;
    phraseEl.style.opacity = 0;
    setTimeout(()=>{ phraseEl.textContent = phrases[i]; phraseEl.style.opacity = 1; }, 350);
  }, 1700);

  try{
    const data = await fetchReading(window.__reading);
    renderResult(window.__reading, data);
    clearInterval(loadingInterval);
    showScreen('screen-result');
    attachResultBanner();
  }catch(e){
    clearInterval(loadingInterval);
    console.error(e);
    document.getElementById('formError').textContent = '풀이 중 문제가 생겼어요. 다시 시도해주세요';
    showScreen('screen-input');
  }
}

// 배포된 백엔드 주소예요.
const API_BASE = "https://reunion-hg13.onrender.com";

async function fetchReading({myName, myGender, myDate, myTime, otherName, otherGender, otherDate, otherTime}){
  // 이 앱은 클라이언트에서 AI API를 직접 호출하지 않아요.
  // API 키를 클라이언트에 넣으면 노출되기 때문에, 자체 서버(API_BASE + /api/reading)가 대신 호출하고
  // 아래와 같은 형태의 JSON을 그대로 반환해 주는 구조예요.
  // 서버 구현 예시는 server-example/reading.js를 참고하세요.
  const response = await fetch(`${API_BASE}/api/reading`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      myName, myGender, myDate, myTime,
      otherName, otherGender, otherDate, otherTime
    }),
    signal: AbortSignal.timeout(60000) // 렌더 무료 티어 콜드스타트(최대 ~50초)를 버틸 수 있게 넉넉히
  });
  if (!response.ok) {
    throw new Error(`풀이 서버 응답 오류: ${response.status}`);
  }
  return await response.json();
}

function renderResult({myName, otherName}, data){
  document.getElementById('resultTitle').textContent = data.title || '두 사람의 인연 이야기';
  document.getElementById('resultNames').textContent = `${myName} · ${otherName}`;
  document.getElementById('mySaju').textContent = data.my_saju || '';
  document.getElementById('otherSaju').textContent = data.other_saju || '';
  document.getElementById('compatText').textContent = data.compat_text || '';
  document.getElementById('reunionView').textContent = data.reunion_view || '';
  document.getElementById('timingText').textContent = data.timing_text || '';
  document.getElementById('adviceText').textContent = data.advice || '';
  document.getElementById('shareLinePreview').textContent = `“ ${data.share_line || ''} ”`;

  const score = Math.max(1, Math.min(100, parseInt(data.score) || 50));
  document.getElementById('gaugeNum').textContent = score;
  const circumference = 364.4;
  const offset = circumference * (1 - score/100);
  requestAnimationFrame(()=>{
    document.getElementById('gaugeArc').style.strokeDashoffset = offset;
  });

  // prep card
  document.getElementById('cardNames').textContent = `${myName} & ${otherName}`;
  document.getElementById('cardScore').textContent = score;
  document.getElementById('cardQuote').textContent = `“ ${data.share_line || ''} ”`;
  const today = new Date();
  document.getElementById('cardDate').textContent = `${today.getFullYear()}.${String(today.getMonth()+1).padStart(2,'0')}.${String(today.getDate()).padStart(2,'0')}`;
}

function goToCard(){
  showScreen('screen-card');
}

async function downloadCard(){
  const btn = document.querySelector('#screen-card .card-actions .cta:not(.ghost)');
  const originalLabel = btn ? btn.textContent : '';
  if (btn) { btn.textContent = '저장 중...'; btn.disabled = true; }

  try {
    const el = document.getElementById('shareCard');
    const canvas = await html2canvas(el, { backgroundColor: '#F8EFE2', scale: 3 });
    const dataUrl = canvas.toDataURL('image/png');
    const base64Only = dataUrl.split(',')[1]; // "data:image/png;base64," 접두어 제거

    if (File.saveBase64.isSupported()) {
      // 토스 앱 안에서는 SDK로 기기 갤러리에 저장해요.
      await File.saveBase64({
        data: base64Only,
        fileName: '인연카드.png',
        mimeType: 'image/png',
      });
      if (btn) btn.textContent = '저장 완료!';
    } else {
      // 토스 앱 밖(일반 브라우저)에서 테스트할 때는 다운로드 링크로 대체해요.
      const link = document.createElement('a');
      link.download = '인연카드.png';
      link.href = dataUrl;
      link.click();
      if (btn) btn.textContent = '저장 완료!';
    }
  } catch (e) {
    console.error('카드 저장 실패:', e);
    if (btn) btn.textContent = '저장 실패, 다시 시도';
  } finally {
    setTimeout(() => {
      if (btn) { btn.textContent = originalLabel || '이미지로 저장'; btn.disabled = false; }
    }, 1800);
  }
}

window.startReading = startReading;
window.goToCard = goToCard;
window.downloadCard = downloadCard;
window.resetApp = resetApp;
</script>
</body>
</html>
